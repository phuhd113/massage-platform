services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: massage_postgres
    environment:
      POSTGRES_USER: massage
      POSTGRES_PASSWORD: massage_dev_pw
      POSTGRES_DB: massage_platform
    # Cổng host lệch mặc định để chạy song song với các dự án khác trên cùng máy.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U massage -d massage_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: massage_redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Massage.Api/Dockerfile
    container_name: massage_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Trong mạng compose, Postgres nghe ở cổng nội bộ 5432 chứ không phải cổng
      # đã ánh xạ ra host.
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=massage_platform;Username=massage;Password=massage_dev_pw'
      Jwt__Secret: 'dev-only-secret-do-not-use-in-production-min-32-chars'
      Redis__Host: redis
      Redis__Port: '6379'
    ports:
      - '5080:8080'
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  redisdata:
  uploads:
