services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: massage_postgres
    environment:
      POSTGRES_USER: massage
      POSTGRES_PASSWORD: massage_dev_pw
      POSTGRES_DB: massage_platform
    # Cổng host lệch mặc định để chạy song song với các dự án khác trên cùng máy.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U massage -d massage_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: massage_redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
