services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: massage_postgres
    environment:
      POSTGRES_USER: massage
      POSTGRES_PASSWORD: massage_dev_pw
      POSTGRES_DB: massage_platform
    # Cổng host lệch mặc định để chạy song song với các dự án khác trên cùng máy.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U massage -d massage_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: massage_redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Massage.Api/Dockerfile
    container_name: massage_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Trong mạng compose, Postgres nghe ở cổng nội bộ 5432 chứ không phải cổng
      # đã ánh xạ ra host.
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=massage_platform;Username=massage;Password=massage_dev_pw'
      Jwt__Secret: 'dev-only-secret-do-not-use-in-production-min-32-chars'
      Redis__Host: redis
      Redis__Port: '6379'
      # Để trống thì API dùng đĩa local (volume uploads bên dưới). Điền vào file .env
      # ở gốc repo để chạy thử R2 — .env không được commit.
      R2__AccountId: ${R2_ACCOUNT_ID:-}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      R2__Bucket: ${R2_BUCKET:-massage-platform}
      R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL:-}
      # OTP: để trống thì dùng stub (mã trả thẳng trong response). Điền vào .env để
      # gửi thật qua Zalo ZNS — xem docs/zalo-zns-setup.md. Stub luôn thắng khi bật,
      # nên máy dev có credential thật cũng không đốt quota.
      Otp__StubEnabled: ${OTP_STUB_ENABLED:-true}
      Zalo__Zns__AppId: ${ZALO_ZNS_APP_ID:-}
      Zalo__Zns__SecretKey: ${ZALO_ZNS_SECRET_KEY:-}
      Zalo__Zns__RefreshToken: ${ZALO_ZNS_REFRESH_TOKEN:-}
      Zalo__Zns__TemplateId: ${ZALO_ZNS_TEMPLATE_ID:-}
      Zalo__Zns__CodeParamName: ${ZALO_ZNS_CODE_PARAM:-otp}
      Zalo__Zns__ExpiryParamName: ${ZALO_ZNS_EXPIRY_PARAM:-}
      Zalo__Zns__DevMode: ${ZALO_ZNS_DEV_MODE:-false}
    ports:
      - '5080:8080'
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Phải là build arg, không chỉ là biến lúc chạy: next.config.mjs dựng
        # images.remotePatterns từ nó và Next chốt danh sách đó vào bản build.
        NEXT_PUBLIC_MEDIA_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
        # Cùng lý do, khác cơ chế: `app/robots.ts` là route tĩnh nên host được ghi
        # thẳng vào robots.txt lúc build. Phải khai ở **cả hai** chỗ (arg và
        # environment) — sitemap.xml là route động và đọc biến lúc chạy, nên khai
        # thiếu một vế là robots.txt và sitemap.xml trỏ hai host khác nhau.
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    container_name: massage_web
    depends_on:
      - api
    environment:
      # Server component gọi API qua mạng nội bộ compose.
      API_BASE_URL: "http://api:8080/api/v1"
      # Trình duyệt gọi thẳng API khi ghi lead, để backend thấy đúng IP khách
      # thay vì IP của Next.
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:5080/api/v1"
      # Giữ localhost ở stack dev: biến này đi thẳng vào canonical, hreflang và
      # og:url. Đặt "https://masgo.vn" ở đây thì mọi trang chạy trên máy dev tự khai
      # canonical trỏ về production — và nếu bản dev nào lọt ra ngoài cho Googlebot
      # thấy, nó khai hộ luôn. Deploy thật đặt SITE_URL=https://masgo.vn, và phải
      # `up -d --build web` chứ không chỉ restart: robots.txt chốt host lúc build.
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      # next/image chặn mọi host không khai trước, nên origin ảnh phải tới được cả
      # lúc build (dựng remotePatterns) lẫn lúc chạy. Để trống thì ảnh đi qua
      # /uploads của API như trước.
      NEXT_PUBLIC_MEDIA_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  uploads:
