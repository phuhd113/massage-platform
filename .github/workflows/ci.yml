name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Dùng đúng image PostGIS như dev để test chạy trên cùng phiên bản extension,
        # thay vì postgres thuần rồi phát hiện lệch lúc deploy.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: massage
          POSTGRES_PASSWORD: massage_dev_pw
          POSTGRES_DB: massage_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__Default: 'Host=localhost;Port=5432;Database=massage_platform;Username=massage;Password=massage_dev_pw'
      TEST_DB_CONNECTION: 'Host=localhost;Port=5432;Database=postgres;Username=massage;Password=massage_dev_pw'
      Jwt__Secret: 'ci-only-secret-not-used-anywhere-else-32ch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore Massage.sln

      # Cảnh báo build là lỗi trong CI: nullable warning ở tầng entity thường là
      # dấu hiệu của null reference chờ nổ lúc chạy.
      - run: dotnet build Massage.sln --no-restore -warnaserror

      - name: Kiểm tra format code
        run: dotnet format Massage.sln --verify-no-changes --no-restore

      - run: dotnet test Massage.sln --no-build --verbosity normal

      - name: Migration phải rollback được (up → down → up)
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          cd src/Massage.Api
          dotnet ef database update --no-build
          dotnet ef database update 0 --no-build
          dotnet ef database update --no-build

      - name: Docker image build được
        run: docker build -f src/Massage.Api/Dockerfile -t massage-api:ci .
